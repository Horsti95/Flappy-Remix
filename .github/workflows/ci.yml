name: CI

# Typecheck, tests and a production build on every push to main and every PR.
# The fast unit suite + a strict tsc build already exist — this just makes them
# gate merges instead of relying on the author remembering to run them.

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR/branch cancels the outdated in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The SQL half of the suite: vitest never touches the database, so migration
  # regressions (a privilege that quietly re-opens, a race that comes back)
  # were invisible to CI. This applies every migration to a throwaway Postgres
  # and asserts the security + concurrency invariants.
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql postgresql-client
      - name: Apply migrations and assert invariants
        run: sudo -E ./scripts/test-migrations.sh
