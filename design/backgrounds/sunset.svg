<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="180" height="320">
  <title>Sunset — red/orange gradient, golden hour</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1f5e"/>
      <stop offset="55%" stop-color="#ee6c4d"/>
      <stop offset="100%" stop-color="#f9c784"/>
    </linearGradient>
  </defs>
  <rect width="360" height="640" fill="url(#g)"/>
  <circle cx="180" cy="420" r="60" fill="#fef3c7" opacity="0.95"/>
  <circle cx="180" cy="420" r="80" fill="#fef3c7" opacity="0.3"/>
  <circle cx="180" cy="420" r="110" fill="#fef3c7" opacity="0.12"/>
  <rect x="120" y="0" width="56" height="260" fill="#1f3540" opacity="0.92"/>
  <rect x="120" y="400" width="56" height="240" fill="#1f3540" opacity="0.92"/>
  <g transform="translate(80 320) rotate(-8) scale(2.4)">
    <polygon points="-14,6 14,-6 1,0 14,-6 -1,11" fill="#f4ead5" stroke="#1a1a1a" stroke-width="0.6"/>
    <polygon points="1,0 -14,6 -1,11" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="0.6"/>
  </g>
</svg>
