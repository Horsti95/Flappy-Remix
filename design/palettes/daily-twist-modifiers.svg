<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460">
  <title>Daily twist — modifier candidates with visual hints</title>
  <style>
    .h    { font: bold 14px system-ui; fill: #1a1a1a; }
    .lbl  { font: 11px system-ui; fill: #1a1a1a; }
    .num  { font: 10px ui-monospace,Menlo,monospace; fill: #4a4a4a; }
  </style>
  <rect width="720" height="460" fill="#f8f6ef"/>
  <text class="h" x="24" y="32">Daily twist — one modifier per UTC day, derived from the daily seed</text>
  <text class="h" x="24" y="68" font-size="12">PHYSICS-ONLY (1-2 hours each)</text>
  <g transform="translate(24 80)">
    <rect width="160" height="90" fill="#ffffff" stroke="#1a1a1a"/>
    <rect x="40" y="6" width="36" height="32" fill="#3d8b58"/>
    <rect x="40" y="58" width="36" height="32" fill="#3d8b58"/>
    <text class="lbl" x="80" y="76" text-anchor="middle">wider gap</text>
    <text class="num" x="80" y="86" text-anchor="middle">gapH + 20</text>
  </g>
  <g transform="translate(192 80)">
    <rect width="160" height="90" fill="#ffffff" stroke="#1a1a1a"/>
    <rect x="40" y="6" width="36" height="40" fill="#3d8b58"/>
    <rect x="40" y="58" width="36" height="32" fill="#3d8b58"/>
    <text class="lbl" x="80" y="76" text-anchor="middle">tight gap</text>
    <text class="num" x="80" y="86" text-anchor="middle">gapH - 15</text>
  </g>
  <g transform="translate(360 80)">
    <rect width="160" height="90" fill="#ffffff" stroke="#1a1a1a"/>
    <g transform="translate(80 45)">
      <polygon points="-30,0 18,-6 4,0 18,-6 -10,8" fill="#f4ead5" stroke="#1a1a1a" stroke-width="0.6"/>
      <path d="M -34 -2 L -42 -2 M -34 4 L -48 4 M -34 0 L -52 0" stroke="#1a1a1a" stroke-width="1" opacity="0.6"/>
    </g>
    <text class="lbl" x="80" y="76" text-anchor="middle">faster scroll</text>
    <text class="num" x="80" y="86" text-anchor="middle">* 1.25</text>
  </g>
  <g transform="translate(528 80)">
    <rect width="168" height="90" fill="#ffffff" stroke="#1a1a1a"/>
    <g transform="translate(84 36)">
      <polygon points="-12,0 12,-6 1,-2 12,-6 -1,9" fill="#f4ead5" stroke="#1a1a1a" stroke-width="0.6"/>
      <path d="M 0 14 v 20" stroke="#1a1a1a" stroke-width="1" opacity="0.6"/>
      <polygon points="-3,30 3,30 0,38" fill="#1a1a1a" opacity="0.6"/>
    </g>
    <text class="lbl" x="84" y="76" text-anchor="middle">heavier gravity</text>
    <text class="num" x="84" y="86" text-anchor="middle">gravity * 1.15</text>
  </g>
  <text class="h" x="24" y="208" font-size="12">VISUAL (half-day each)</text>
  <g transform="translate(24 220)">
    <rect width="160" height="110" fill="#cdd6dd" stroke="#1a1a1a"/>
    <rect x="40" y="6" width="36" height="40" fill="#3d8b58" opacity="0.45"/>
    <rect x="40" y="64" width="36" height="40" fill="#3d8b58" opacity="0.45"/>
    <radialGradient id="vis2" cx="20%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#cdd6dd" stop-opacity="0"/>
      <stop offset="100%" stop-color="#cdd6dd" stop-opacity="0.95"/>
    </radialGradient>
    <rect x="0" y="0" width="160" height="110" fill="url(#vis2)"/>
    <g transform="translate(34 60)">
      <polygon points="-10,3 10,-5 1,0 10,-5 -1,8" fill="#f4ead5" stroke="#1a1a1a" stroke-width="0.4"/>
    </g>
    <text class="lbl" x="80" y="96" text-anchor="middle">fog</text>
    <text class="num" x="80" y="106" text-anchor="middle">visibility ~ 60%</text>
  </g>
  <g transform="translate(192 220)">
    <rect width="160" height="110" fill="#0b1226" stroke="#1a1a1a"/>
    <circle cx="130" cy="22" r="12" fill="#f4ead5"/>
    <circle cx="124" cy="18" r="12" fill="#0b1226"/>
    <g fill="#f4ead5">
      <circle cx="30" cy="20" r="0.8"/>
      <circle cx="60" cy="40" r="1"/>
      <circle cx="100" cy="60" r="0.7"/>
      <circle cx="20" cy="70" r="1.1"/>
    </g>
    <rect x="40" y="0" width="36" height="40" fill="#2b6f4d" opacity="0.95"/>
    <rect x="40" y="68" width="36" height="42" fill="#2b6f4d" opacity="0.95"/>
    <g transform="translate(34 56)">
      <polygon points="-10,3 10,-5 1,0 10,-5 -1,8" fill="#f4ead5" stroke="#1a1a1a" stroke-width="0.4"/>
    </g>
    <text class="lbl" x="80" y="96" text-anchor="middle" fill="#f4ead5">night sky</text>
    <text class="num" x="80" y="106" text-anchor="middle" fill="#cdd6dd">dark + stars</text>
  </g>
  <g transform="translate(360 220)">
    <linearGradient id="ss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1f5e"/>
      <stop offset="60%" stop-color="#ee6c4d"/>
      <stop offset="100%" stop-color="#f9c784"/>
    </linearGradient>
    <rect width="160" height="110" fill="url(#ss)" stroke="#1a1a1a"/>
    <circle cx="80" cy="78" r="14" fill="#fef3c7"/>
    <rect x="40" y="0" width="36" height="38" fill="#1f3540"/>
    <rect x="40" y="68" width="36" height="42" fill="#1f3540"/>
    <g transform="translate(34 56)">
      <polygon points="-10,3 10,-5 1,0 10,-5 -1,8" fill="#f4ead5" stroke="#1a1a1a" stroke-width="0.4"/>
    </g>
    <text class="lbl" x="80" y="100" text-anchor="middle" fill="#fef3c7">sunset</text>
  </g>
  <text class="h" x="24" y="358" font-size="12">MECHANICAL</text>
  <g transform="translate(24 370)">
    <rect width="320" height="70" fill="#ffffff" stroke="#1a1a1a"/>
    <g transform="translate(60 35)">
      <polygon points="-10,3 10,-5 1,0 10,-5 -1,8" fill="#f4ead5" stroke="#1a1a1a" stroke-width="0.4"/>
      <path d="M 16 -10 q 30 0 60 -2" stroke="#1a1a1a" stroke-width="1.5" fill="none" opacity="0.6"/>
      <path d="M 16 -2  q 30 0 60 -2" stroke="#1a1a1a" stroke-width="1.5" fill="none" opacity="0.6"/>
      <path d="M 16  6  q 30 0 60 -2" stroke="#1a1a1a" stroke-width="1.5" fill="none" opacity="0.6"/>
    </g>
    <text class="lbl" x="160" y="60" text-anchor="middle">headwind — small leftward force pulsing every ~2s</text>
  </g>
</svg>
