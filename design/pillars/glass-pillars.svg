<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="180" height="320">
  <title>Pillar style: Glass pillars</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87ceeb"/>
      <stop offset="100%" stop-color="#b3e5fc"/>
    </linearGradient>
  </defs>
  <rect width="360" height="640" fill="url(#sky)"/>

  <!-- Top pillar - glass, semi-transparent -->
  <rect x="120" y="0" width="56" height="240" fill="#87ceeb" opacity="0.45" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="126" y="0" width="8" height="240" fill="#ffffff" opacity="0.25"/>
  <rect x="114" y="234" width="68" height="12" fill="#a8d8ea" opacity="0.7" stroke="#ffffff" stroke-width="1" rx="3"/>

  <!-- Bottom pillar - glass -->
  <rect x="120" y="400" width="56" height="240" fill="#87ceeb" opacity="0.45" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="126" y="400" width="8" height="240" fill="#ffffff" opacity="0.25"/>
  <rect x="114" y="400" width="68" height="12" fill="#a8d8ea" opacity="0.7" stroke="#ffffff" stroke-width="1" rx="3"/>

  <!-- Paper plane -->
  <g transform="translate(80 320) rotate(-8) scale(2.4)">
    <polygon points="-14,6 14,-6 1,0 14,-6 -1,11" fill="#f4ead5" stroke="#1a1a1a" stroke-width="0.6"/>
    <polygon points="1,0 -14,6 -1,11" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="0.6"/>
  </g>

  <text x="180" y="620" text-anchor="middle" fill="#1a1a1a" opacity="0.5" font-family="system-ui" font-size="12">glass pillars — semi-transparent, light reflection</text>
</svg>
