<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="180" height="320">
  <title>Pillar style: Neon (night theme variant)</title>
  <defs>
    <linearGradient id="nightsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1226"/>
      <stop offset="100%" stop-color="#1a2c4e"/>
    </linearGradient>
  </defs>
  <rect width="360" height="640" fill="url(#nightsky)"/>

  <!-- Stars -->
  <g fill="#f4ead5" opacity="0.6">
    <circle cx="40" cy="80" r="1"/>
    <circle cx="200" cy="50" r="1.2"/>
    <circle cx="300" cy="120" r="0.8"/>
    <circle cx="80" cy="200" r="1"/>
    <circle cx="280" cy="300" r="0.9"/>
    <circle cx="50" cy="500" r="1.1"/>
  </g>

  <!-- Top pillar - neon outline, dark fill -->
  <rect x="120" y="0" width="56" height="240" fill="#0d1b2a" stroke="#00d4ff" stroke-width="2"/>
  <rect x="120" y="0" width="56" height="240" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.3" stroke-dasharray="0" filter="url(#glow)"/>
  <rect x="114" y="234" width="68" height="12" fill="#0d1b2a" stroke="#00d4ff" stroke-width="1.5" rx="2"/>

  <!-- Bottom pillar - neon outline -->
  <rect x="120" y="400" width="56" height="240" fill="#0d1b2a" stroke="#00d4ff" stroke-width="2"/>
  <rect x="114" y="400" width="68" height="12" fill="#0d1b2a" stroke="#00d4ff" stroke-width="1.5" rx="2"/>

  <!-- Paper plane -->
  <g transform="translate(80 320) rotate(-8) scale(2.4)">
    <polygon points="-14,6 14,-6 1,0 14,-6 -1,11" fill="#f4ead5" stroke="#00d4ff" stroke-width="0.6"/>
    <polygon points="1,0 -14,6 -1,11" fill="#1a1a1a" stroke="#00d4ff" stroke-width="0.6"/>
  </g>

  <text x="180" y="620" text-anchor="middle" fill="#00d4ff" opacity="0.7" font-family="system-ui" font-size="12">neon pillars — night theme variant</text>
</svg>
