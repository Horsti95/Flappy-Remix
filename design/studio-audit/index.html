<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glide · Art inventory</title><style>
*{box-sizing:border-box}body{margin:24px;background:#f4f0e6;color:#203f38;font:13px/1.5 system-ui}h1,h2{font-family:Georgia,serif}nav{display:flex;gap:12px;margin-bottom:20px}button{padding:12px;background:#fff;border:1px solid #bcc9bd;border-radius:6px}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:12px}figure{margin:0;background:#fffdf7;border:1px solid #d9ddcd;border-radius:6px;padding:8px}img{width:100%;height:170px;object-fit:contain}svg,canvas{width:100%;height:100px}figcaption{font-size:10px;overflow-wrap:anywhere}button[aria-pressed=true]{background:#254d40;color:white}</style></head><body><a href="/">Play Glide</a><h1>One game, several visual languages.</h1><p>Read-only inventory. Original files are preserved. Use the three tabs to compare every registered visual.</p><nav><button id="backgrounds">Backgrounds</button><button id="shapes">All playable shapes</button><button id="pillars">Pillars</button></nav><main id="inventory"></main><script type="module">
import {THEMES} from '/src/game/themes.ts';import {getBackgroundSource} from '/src/game/backgrounds.ts';import {SHAPES} from '/src/game/shapes.ts';import {shapeSvgInner} from '/src/ui/shape-svg.ts';import {PILLAR_STYLES} from '/src/game/pillars.ts';
const out=document.querySelector('#inventory');
function show(type){out.replaceChildren();document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.id===type)));
if(type==='backgrounds'){const seen=new Set();for(const t of THEMES){const ids=t.backgroundStages?.map(s=>s.image)??[t.backgroundImage];for(const id of ids){if(id&&seen.has(id))continue;if(id)seen.add(id);const f=document.createElement('figure');f.innerHTML=id?`<img src="${getBackgroundSource(id)}" alt="${id}"><figcaption>${id}</figcaption>`:`<div style="height:170px;background:linear-gradient(${t.colors.skyTop},${t.colors.skyBottom})"></div><figcaption>${t.id} · native gradient / effects</figcaption>`;out.append(f)}}}
if(type==='shapes'){for(const s of SHAPES){const f=document.createElement('figure');f.innerHTML=`<svg viewBox="-20 -20 40 40">${shapeSvgInner(s.id,[231,227,216],[176,110,66])}</svg><figcaption>${s.id}${s.hidden?' · hidden':''}</figcaption>`;out.append(f)}}
if(type==='pillars'){for(const p of PILLAR_STYLES){const f=document.createElement('figure');const c=document.createElement('canvas');c.width=150;c.height=140;p.draw({ctx:c.getContext('2d'),x:50,gapY:50,gapH:40,worldHeight:140,pipeWidth:45,over:0,bodyColor:'#729587',capColor:'#d3c8a4',highContrast:false});f.append(c);const label=document.createElement('figcaption');label.textContent=p.id;f.append(label);out.append(f)}}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.id));show('backgrounds');
</script></body></html>
