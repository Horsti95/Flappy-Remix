<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
    <meta name="theme-color" content="#87ceeb" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Pflug — a daily flap-through-gaps arcade. Same seed for the world, every day." />
    <title>Pflug</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pflug" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta property="og:title" content="Pflug" />
    <meta property="og:description" content="Daily flap-through-gaps. Same seed for the world, every day." />
    <meta property="og:image" content="/icons/og-default.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pflug" />
    <meta name="twitter:description" content="Daily flap-through-gaps. Same seed for the world, every day." />
    <meta name="twitter:image" content="/icons/og-default.png" />
  </head>
  <body class="bg-sky-day text-ink overflow-hidden">
    <a href="#stage" class="sr-only">Skip to game</a>
    <div id="splash" aria-hidden="true" style="
      position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:24px;
      background:linear-gradient(180deg,#87ceeb 0%,#b8dff0 40%,#f4ead5 100%);
      color:#1a1a1a;font-family:system-ui,sans-serif;
      transition:opacity 380ms ease-out;
    ">
      <svg viewBox="-20 -20 40 40" style="width:96px;height:96px;animation:splash-bob 1.6s ease-in-out infinite;">
        <polygon points="-14,6 14,-6 1,0 14,-6 -1,11" fill="#f4ead5" stroke="#1a1a1a" stroke-width="0.9"/>
        <polygon points="1,0 -14,6 -1,11" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="0.9"/>
      </svg>
      <div style="font-weight:800;font-size:42px;letter-spacing:0.05em;">Pflug</div>
      <div style="font-size:11px;opacity:0.6;text-transform:uppercase;letter-spacing:0.25em;">loading…</div>
      <style>
        @keyframes splash-bob {
          0%, 100% { transform: translateY(0) rotate(-6deg); }
          50%      { transform: translateY(-10px) rotate(6deg); }
        }
        #splash.splash-leaving { opacity: 0; pointer-events: none; }
      </style>
    </div>
    <main id="app" class="fixed inset-0 flex items-center justify-center" aria-label="Pflug game"></main>
    <noscript>
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:system-ui;padding:2rem;text-align:center;background:#1a1a1a;color:#f4ead5;">
        Pflug needs JavaScript to run. Enable it and reload to play.
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
