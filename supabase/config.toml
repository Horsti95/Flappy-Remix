# Project-level config consumed by the supabase CLI.
# See https://supabase.com/docs/guides/cli/config

project_id = "pflug"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_anonymous_sign_ins = true
enable_signup = true

[auth.email]
enable_signup = false
enable_confirmations = false

[auth.external.google]
enabled = true
# client_id / secret pulled from env via the dashboard or CLI secrets
